<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="refresh" content="5; url=https://status.kusotech.club/">
  <link rel="canonical" href="https://status.kusotech.club/">
  <title>X 岛服务状态 · 新地址</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #242628; background: #f8f9fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 20px; }
    main { width: min(100%, 760px); text-align: center; }
    .label { color: #777d83; font-size: 12px; letter-spacing: .16em; }
    h1 { margin: 12px 0; font-size: clamp(26px, 5vw, 34px); font-weight: 600; }
    p { color: #737a80; font-size: 14px; line-height: 1.8; }
    .entry { display: inline-block; margin: 6px 0 24px; border-radius: 10px; padding: 11px 22px; color: #fff; background: #167d60; text-decoration: none; font-size: 14px; }
    .entry:hover { background: #11654d; }
    .entry:focus-visible { outline: 3px solid #70cbb0; outline-offset: 4px; }
    figure { margin: 0; }
    img { display: block; margin: 0 auto; border-radius: 12px; object-fit: contain; }
    figcaption { margin-top: 12px; color: #8a9095; font-size: 12px; }
    @media (prefers-color-scheme: dark) { :root { color: #eceeef; background: #171819; } p, .label { color: #a1a7ac; } }
  </style>
</head>
<body>
  <main>
    <div class="label">X 岛 · STATUS</div>
    <h1>状态页搬家了</h1>
    <p>5 秒后自动前往新地址。<br>如果没有跳转，请点击下方按钮。</p>
    <a class="entry" href="https://status.kusotech.club/">前往 status.kusotech.club ↗</a>
    <figure>
      <img src="https://moetu.org/xdchan/cover.php?from=index" title="伪随机" alt="伪随机" style="max-width: 100%; max-height: 60vh">
      <figcaption>路过看看随机配图，再去看看岛上的状态。</figcaption>
    </figure>
  </main>
</body>
</html>
